# The package's CI: glitchr-studio/ci's reusable workflow (the PHP 8.4 image, the package installed
# alone, a consumer install without require-dev). Abandoned, no code of its own: no PHPUnit, no
# PHPStan; the consumer install must still find the classes it names, through omnisense/omniauth.
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@main
    with:
      phpunit: false
      phpstan: false
      smoke-class: 'Omniauth\OAuth\OAuthMethod'
